name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest -q
      - name: CLI smoke
        run: |
          vcard-cpu show src/vcard_cpu/kernels/pt100.vcf | head -3
          vcard-cpu expr "a * b + c" -i a -i b -i c --n 100000
